<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-app">
        <header class="chat-header">
            <div>
                <h1>AI Chatbot</h1>
                <p>Responsive chatbot interface for your AI project.</p>
            </div>
        </header>

        <main class="chat-window" id="chatWindow" aria-live="polite">
            <div class="empty-state" id="emptyState">
                <span>Ask me anything.</span>
            </div>
        </main>

        <form class="chat-form" id="chatForm">
            <label for="userInput" class="sr-only">Type your message</label>
            <input id="userInput" type="text" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
